server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app is a single-page router: unknown paths must return index.html,
    # not a 404, or a refresh on /my-learning breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the browser needs no CORS grant in the container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mock-sunbird/ {
        proxy_pass http://backend:8000/mock-sunbird/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }
}
